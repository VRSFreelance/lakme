<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Thank You | L'Amour</title>

  <!-- Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap" rel="stylesheet">
  <link href="https://fonts.cdnfonts.com/css/argesta-headline" rel="stylesheet">

  <style>
    :root {
      --primary: #FFD695;
      --primary-light: #FFEBCa;
      --primary-dark: #dcb86f;
      --dark: #000;
      --font-headline: 'Argesta Headline', 'Montserrat', serif;
      --font-body: 'Montserrat', sans-serif;
    }

    body {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 80vh;
      background-color: var(--dark);
      color: #fff;
      text-align: center;
      font-family: var(--font-body);
      margin: 0;
      padding: 20px;
    }

    .thank-you-container {
      max-width: 700px;
      padding: 40px 20px;
    }

    /* Gradient heading with underline */
    .thank-you-title {
      font-family: var(--font-headline);
      font-size: 3rem;
      margin-bottom: 1rem;
      font-weight: 400;
      display: inline-block;
      position: relative;
      background: linear-gradient(to right, var(--primary) 0%, var(--primary-light) 67%, var(--primary) 95%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .thank-you-title::after {
      content: "";
      display: block;
      height: 3px;
      background: #fff;
      margin: 12px auto 24px;
      width: auto;
      border-radius: 2px;
    }

    .thank-you-message {
      font-size: 1.2rem;
      line-height: 1.6;
      margin-bottom: 2.5rem;
      color: #fff;
    }

    /* Button group */
    .button-group {
      display: flex;
      justify-content: center;
      gap: 20px;
      flex-wrap: wrap;
    }

    .btn-custom {
      display: inline-block;
      padding: 0.8rem 2rem;
      background: linear-gradient(to right, var(--primary) 0%, var(--primary-light) 67%, var(--primary) 95%);
      color: #000;
      text-decoration: none;
      font-weight: 600;
      border-radius: 0;
      transition: all 0.3s ease;
      min-width: 180px;
      text-align: center;
    }
    .btn-custom:hover {
      background: var(--primary-dark);
      color: #000;
    }
  </style>
</head>

<body>
  <div class="thank-you-container">
    <h1 class="thank-you-title">Thank You!</h1>
    <p class="thank-you-message">
      Thanks for sharing your details! <br>
      Our course expert will contact you shortly, or you can talk to us by clicking a button below.
    </p>

    <!-- Two Buttons -->
    <div class="button-group">
      <a href="https://wa.me/919999999999" class="btn-custom">Talk to Lakmé</a>
      <a href="https://wa.me/918888888888" class="btn-custom">Talk to L’Amour</a>
    </div>
  </div>
</body>
</html>
